<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17151c">
  <meta name="description" content="Gestionale operativo di ReFrame Hub.">
  <title>ReFrame — Gestionale</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5dfc'/%3E%3Cpath d='M9 8h14v4H13v4h8v4h-8v4H9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fix.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span>R</span><strong>ReFrame</strong></div>
      <nav id="nav">
        <button class="active" data-view="today"><i>⌂</i>Oggi</button>
        <button data-view="mywork"><i>✓</i>Il mio lavoro <b id="myCount">0</b></button>
        <button data-view="opportunities"><i>◇</i>Opportunità</button>
        <button data-view="projects"><i>▣</i>Progetti</button>
        <button data-view="calendar"><i>□</i>Calendario</button>
        <hr>
        <button data-view="clients"><i>◎</i>Clienti</button>
        <button data-view="team"><i>◌</i>Team</button>
        <button data-view="services"><i>≡</i>Servizi e listini</button>
        <button data-view="finance"><i>€</i>Amministrazione</button>
        <button data-view="insights"><i>↗</i>Insight</button>
      </nav>
      <div class="side-bottom">
        <button class="quick" id="quickOpportunity">＋ Nuova opportunità</button>
        <button class="profile" id="profileButton"><span class="avatar" id="profileAvatar">?</span><span><strong id="profileName">Configura profilo</strong><small id="profileRole">Nessuna persona selezionata</small></span><i>⌃</i></button>
        <div class="profile-menu" id="profileMenu" hidden><small>Vista personale</small><div id="profileOptions"></div></div>
      </div>
    </aside>
    <main>
      <header class="topbar"><div><span>ReFrame Hub</span><i>/</i><strong id="viewLabel">Oggi</strong></div><div><button class="icon" id="searchButton" title="Cerca">⌕</button><button class="profile compact" id="topProfile"><span class="avatar small" id="topAvatar">?</span><span id="topName">Profilo</span><i>⌄</i></button></div></header>
      <div class="mobile-nav" id="mobileNav"></div>
      <div class="content">
        <section class="view active" id="view-today"></section>
        <section class="view" id="view-mywork"></section>
        <section class="view" id="view-opportunities"></section>
        <section class="view" id="view-projects"></section>
        <section class="view" id="view-calendar"></section>
        <section class="view" id="view-clients"></section>
        <section class="view" id="view-team"></section>
        <section class="view" id="view-services"></section>
        <section class="view" id="view-finance"></section>
        <section class="view" id="view-insights"></section>
      </div>
    </main>
  </div>
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <aside class="sheet" id="sheet" aria-hidden="true"><div class="sheet-head"><div><small id="sheetEyebrow"></small><h2 id="sheetTitle"></h2></div><button class="icon" id="closeSheet">×</button></div><div id="sheetBody"></div></aside>
  <div class="modal-wrap" id="modalWrap" hidden><div class="modal"><div class="sheet-head"><div><small>Inserimento rapido</small><h2 id="modalTitle">Nuova opportunità</h2></div><button class="icon" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
